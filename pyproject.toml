[project]
name = "sekoia-valhalla-integration-automation-module"
version = "0.11.3"
description = "Syncs the Nextron Valhalla Sigma feed into the Sekoia Rules Catalog"
authors = []
requires-python = ">=3.11,<3.12"

dependencies = [
    "sekoia-automation-sdk>=1.23.1,<2",
    "requests>=2.34.2,<3",
    "APScheduler>=3.10,<4",
    "PyYAML>=6.0,<7",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "requests-mock",
]

[build-system]
requires = ["uv_build>=0.9.7,<1.0.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[tool.black]
line-length = 119
target-version = ["py311"]
include = "\\.pyi?$"

[tool.isort]
profile = "black"
line_length = 119

[tool.coverage.run]
omit = ["tests/*", "main.py"]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
addopts = '''
  --strict-markers
  --tb=short
  --cov=sekoia_valhalla_integration_modules
  --cov-branch
  --cache-clear
  --cov-report=html
  --cov-report=term-missing:skip-covered
  --cov-fail-under=5
  --capture=sys
'''
